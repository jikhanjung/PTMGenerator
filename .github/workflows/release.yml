name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Refuse to release a tag that does not match version.py, the single source
  # of truth. Catches "tagged v0.1.3 but forgot to bump version.py" before
  # anything is built or published. scripts/bump_version.py keeps them in sync,
  # but a hand-pushed tag could still drift.
  verify-version:
    name: Tag matches version.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          FILE_VERSION="$(python -c 'import re,pathlib; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", pathlib.Path("version.py").read_text()).group(1))')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "version.py: $FILE_VERSION"
          echo "tag:        $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($FILE_VERSION). Bump version.py or fix the tag."
            exit 1
          fi

  # Gate the release on the full test workflow.
  test:
    needs: verify-version
    uses: ./.github/workflows/test.yml

  # Same derivation as build.yml, so a commit built on main and the same
  # commit released carry one build number rather than two.
  build-number:
    name: Build number
    needs: verify-version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.count.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: count
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  # The same build definition build.yml uses, so what a release ships is
  # produced by exactly the steps already verified on main.
  build:
    needs: [test, build-number]
    uses: ./.github/workflows/reusable_build.yml
    with:
      build_number: ${{ needs.build-number.outputs.value }}
      artifact_name: PTMGenerator2-windows
      retention_days: 90

  create-release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PTMGenerator2-windows
          path: dist

      # The tag's own message is the CHANGELOG section bump_version.py copied
      # into it, so the release notes and the changelog cannot disagree.
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY' > notes.md
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.MULTILINE | re.DOTALL,
          )
          # Trailing "---" separates entries; it is not part of the notes.
          body = match.group(1).strip().removesuffix("---").strip() if match else ""
          print(body or f"Release {version}")
          PY
          echo "Release notes:"; cat notes.md

      # SHA256SUMS.txt beside the artifacts, so someone downloading the
      # installer over a link they were sent can check what they got. Written
      # with bare filenames -- `sha256sum -c` resolves them relative to the
      # directory it is run in, and a path from the runner would not exist on
      # the machine doing the checking.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
