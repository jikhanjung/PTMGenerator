name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Refuse to release a tag that does not match version.py, the single source
  # of truth. Catches "tagged v0.1.3 but forgot to bump version.py" before
  # anything is built or published. scripts/bump_version.py keeps them in sync,
  # but a hand-pushed tag could still drift.
  verify-version:
    name: Tag matches version.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          FILE_VERSION="$(python -c 'import re,pathlib; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", pathlib.Path("version.py").read_text()).group(1))')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "version.py: $FILE_VERSION"
          echo "tag:        $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($FILE_VERSION). Bump version.py or fix the tag."
            exit 1
          fi

  # Gate the release on the full test workflow.
  test:
    needs: verify-version
    uses: ./.github/workflows/test.yml

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements*.lock

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build-windows.lock

      # The spec derives the output name from version.py plus the build date,
      # so there is no second version number to keep in step.
      - name: Build
        run: pyinstaller PTMGenerator2.spec

      - name: Find the executable
        id: exe
        shell: bash
        run: echo "path=$(ls dist/*.exe | head -1)" >> "$GITHUB_OUTPUT"

      # A build that produces an .exe which cannot start is still a failed
      # build; the frozen bundle has different import and data-file behaviour
      # from a source checkout.
      - name: Smoke-test the frozen build
        shell: bash
        run: |
          test -s "${{ steps.exe.outputs.path }}" || { echo "::error::no executable produced"; exit 1; }
          echo "built: ${{ steps.exe.outputs.path }} ($(stat -c%s "${{ steps.exe.outputs.path }}") bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: PTMGenerator2-windows
          path: dist/*.exe
          retention-days: 30

  create-release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PTMGenerator2-windows
          path: dist

      # The tag's own message is the CHANGELOG section bump_version.py copied
      # into it, so the release notes and the changelog cannot disagree.
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY' > notes.md
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.MULTILINE | re.DOTALL,
          )
          print(match.group(1).strip() if match else f"Release {version}")
          PY
          echo "Release notes:"; cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
