name: Build

# Builds the Windows installer without releasing anything, so the build can be
# verified before a version tag is pushed. Without this the release workflow's
# build step would be running for the first time *during* a release, and a
# failure there leaves the tag already published.
#
# Run it from the Actions tab, or:
#   gh workflow run build.yml
#
# The artifact appears on the run page and via `gh run download`.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # Only when something that can change the executable changes. Editing the
    # manual should not spend six minutes of Windows runner time.
    paths:
      - '**.py'
      - 'PTMGenerator2.spec'
      - 'pyproject.toml'
      - 'requirements-build-*.lock'
      - 'icons/**'
      - 'translations/*.qm'
      - 'installer/*.template'
      - '.github/workflows/build.yml'
      - '.github/workflows/reusable_build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - 'PTMGenerator2.spec'
      - 'installer/*.template'
      - 'icons/**'
      - 'translations/*.qm'

permissions:
  contents: read

jobs:
  # The build number, shared with release.yml so the same commit stamps the
  # same number whichever workflow builds it. github.run_number cannot: it
  # counts runs of one workflow. The commit count is workflow-independent and
  # monotonic -- and needs the full history, hence fetch-depth: 0.
  build-number:
    name: Build number
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.count.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: count
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: build-number
    uses: ./.github/workflows/reusable_build.yml
    with:
      build_number: ${{ needs.build-number.outputs.value }}
      artifact_name: PTMGenerator2-windows-dev
      retention_days: 14
