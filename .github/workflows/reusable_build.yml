name: Build executable

# The single definition of how the Windows executable is built. Called by
# build.yml (on demand, no release) and by release.yml (after the test matrix,
# before publishing), so the artifact a release ships is produced by exactly the
# same steps that were verified beforehand -- rather than two copies that drift.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name for the uploaded artifact.
        required: false
        type: string
        default: PTMGenerator2-windows
      retention_days:
        required: false
        type: number
        default: 30
    outputs:
      exe_name:
        description: Filename of the executable that was built.
        value: ${{ jobs.build.outputs.exe_name }}

permissions:
  contents: read

jobs:
  build:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      exe_name: ${{ steps.exe.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements*.lock

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build-windows.lock

      # The spec derives the output name from version.py plus the build date,
      # so there is no second version number to keep in step.
      - name: Build
        run: pyinstaller PTMGenerator2.spec

      - name: Locate the executable
        id: exe
        shell: bash
        run: |
          path="$(ls dist/*.exe | head -1)"
          test -s "$path" || { echo "::error::no executable produced"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "built $path ($(stat -c%s "$path") bytes)"

      # The check that source tests cannot make. A checkout has icons/ and
      # translations/ on disk whatever happens; a frozen bundle only has them if
      # PyInstaller was told to include them, and if it was not the executable
      # still starts -- just with no icon and no Korean.
      - name: Self-test the frozen build
        shell: bash
        run: |
          "${{ steps.exe.outputs.path }}" --self-test || {
            echo "::error::the built executable failed its self-test"; exit 1; }

      - name: Summarize
        shell: bash
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.exe.outputs.name }}\` built and self-tested." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.exe
          retention-days: ${{ inputs.retention_days }}
