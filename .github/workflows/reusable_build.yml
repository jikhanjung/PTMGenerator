name: Build executable

# The single definition of how the Windows build is made. Called by build.yml
# (on demand, no release) and by release.yml (after the test matrix, before
# publishing), so the artifact a release ships is produced by exactly the same
# steps that were verified beforehand -- rather than two copies that drift.

on:
  workflow_call:
    inputs:
      build_number:
        # Computed by the caller from the commit count, not taken from
        # github.run_number: that counter is per-workflow, so the same commit
        # built by build.yml and by release.yml would stamp two different
        # numbers into two installers that are byte-for-byte the same build.
        # Matches Modan2, CTHarvester and PaperMeister.
        description: Build number, from `git rev-list --count HEAD`.
        required: true
        type: string
      artifact_name:
        description: Name for the uploaded artifact.
        required: false
        type: string
        default: PTMGenerator2-windows
      retention_days:
        required: false
        type: number
        default: 30
    outputs:
      installer_name:
        description: Filename of the installer that was built.
        value: ${{ jobs.build.outputs.installer_name }}

permissions:
  contents: read

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      installer_name: ${{ steps.installer.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements*.lock

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build-windows.lock

      # onedir: the installer ships the directory. See PTMGenerator2.spec.
      # BUILD_NUMBER is read by the spec, which stamps it into build_info.json
      # and bundles it -- that is what the About dialog reports.
      - name: Build
        run: pyinstaller PTMGenerator2.spec
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}

      - name: Check the build metadata was stamped
        shell: bash
        run: |
          test -f build_info.json || { echo "::error::the spec did not write build_info.json"; exit 1; }
          cat build_info.json
          grep -q '"build_number": "${{ inputs.build_number }}"' build_info.json \
            || { echo "::error::build_info.json does not carry the build number CI passed"; exit 1; }
          test -f dist/PTMGenerator2/build_info.json \
            || { echo "::error::build_info.json was not bundled"; exit 1; }

      - name: Locate the executable
        id: exe
        shell: bash
        run: |
          path="dist/PTMGenerator2/PTMGenerator2.exe"
          test -s "$path" || { echo "::error::no executable produced"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "built $path ($(stat -c%s "$path") bytes)"

      # The check that source tests cannot make. A checkout has icons/ and
      # translations/ on disk whatever happens; a frozen bundle only has them if
      # PyInstaller was told to include them, and if it was not the executable
      # still starts -- just with no icon and no Korean.
      - name: Self-test the frozen build
        shell: bash
        run: |
          "${{ steps.exe.outputs.path }}" --self-test || {
            echo "::error::the built executable failed its self-test"; exit 1; }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Pinned to a GitHub release asset: jrsoftware.org only keeps the
          # latest 6.x under /is/6/, so a pinned installer URL there starts
          # returning 404 the moment a new version ships and takes every
          # Windows build down with it. Same source and version as Modan2,
          # CTHarvester and PaperMeister, which hit this first.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile inno.exe
          Start-Process -FilePath inno.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            echo "::error::Inno Setup did not install"; exit 1
          }

      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          $ver = python -c "import version; print(version.__version__)"
          $env:BUILD_NUMBER = "${{ inputs.build_number }}"
          $tpl = Get-Content "installer/PTMGenerator2.iss.template" -Raw
          $tpl = $tpl.Replace("{{VERSION}}", $ver).
                      Replace("{{DIST_PATH}}", "$PWD\dist").
                      Replace("{{OUTPUT_DIR}}", "$PWD\installer\Output")
          Set-Content -Path "installer/PTMGenerator2.iss" -Value $tpl
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/PTMGenerator2.iss"
          if ($LASTEXITCODE -ne 0) { echo "::error::ISCC failed"; exit 1 }
          $built = Get-ChildItem "installer/Output/*.exe" | Select-Object -First 1
          if (-not $built) { echo "::error::no installer produced"; exit 1 }
          # Moved to the root so the upload pattern is a plain filename. The
          # release workflow globs what it downloads, and a nested path there
          # once meant the installer was built and then never attached.
          Move-Item $built.FullName -Destination "." -Force
          echo "name=$($built.Name)" >> $env:GITHUB_OUTPUT
          echo "built $($built.Name) ($((Get-Item $built.Name).Length) bytes)"

      - name: Summarize
        shell: bash
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.installer.outputs.name }}\` built; the bundled" \
               "executable passed its self-test." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: PTMGenerator2_*_Installer.exe
          retention-days: ${{ inputs.retention_days }}
