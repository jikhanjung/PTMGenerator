name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# One deployment at a time. Cancelling an in-progress *run* would be wrong
# here — a half-finished Pages deployment is worse than a slightly stale one —
# so queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Manual builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Installs docs/manual/requirements.txt rather than naming packages here.
      # A job that lists its own subset is how a docs build comes to fail
      # quietly -- conf.py imports version.py, which needs semver, and api.rst
      # autodocs core.serial_controller, which imports pyserial.
      - name: Install
        run: pip install -r docs/manual/requirements.txt

      # -W turns warnings into errors, so a broken cross-reference, a malformed
      # table, or markup a translation broke fails the build rather than
      # scrolling past. Each language is built separately into its own
      # directory; the Korean catalogues live in docs/manual/locale/ko/.
      - name: Build English
        run: sphinx-build -W -b html -D language=en docs/manual docs/manual/_build/html/en

      - name: Build Korean
        run: sphinx-build -W -b html -D language=ko docs/manual docs/manual/_build/html/ko

      # The site root has no page of its own, so send it to English. The
      # in-page switcher swaps the language segment from there.
      - name: Redirect the site root
        run: |
          cat > docs/manual/_build/html/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=en/index.html">
            <link rel="canonical" href="en/index.html">
            <title>PTMGenerator2</title>
          </head>
          <body>
            <p><a href="en/index.html">English</a> &middot; <a href="ko/index.html">한국어</a></p>
          </body>
          </html>
          HTML

      # Sphinx writes _static/ and _sources/; without this Pages runs the
      # output through Jekyll, which skips every path beginning with an
      # underscore and serves the manual with no CSS.
      - name: Disable Jekyll
        run: touch docs/manual/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manual/_build/html

  # Publishes to https://jikhanjung.github.io/PTMGenerator/. Pull requests
  # build but do not deploy: a PR from a fork must not be able to replace the
  # published manual.
  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
