# Pre-commit hooks for PTMGenerator2
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ruff - linter + formatter, replacing black, isort, flake8 and pyupgrade.
  # Configuration lives in pyproject.toml under [tool.ruff].
  #
  # Keep `rev` in lockstep with the ruff pin in pyproject.toml's dev extra and
  # the `lint` job in .github/workflows/test.yml. A newer ruff reformats code
  # the pinned one accepted, which turns every unrelated PR red.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|rst|ts)$'
      - id: end-of-file-fixer
        # .qm files are compiled binaries and .ts is generated XML; both are
        # rewritten wholesale by the translation tools.
        exclude: '\.(qm|ts)$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # mypy - scoped to core/, the Qt-free half. Widening to ui/ means teaching
  # mypy about PyQt5's stubs; do it a module at a time. Tracked in TODOs.md.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--config-file=pyproject.toml']
        files: '^core/.*\.py$'
        exclude: 'tests/|build/|dist/|legacy/'

default_language_version:
  python: python3.12

ci:
  autofix_commit_msg: 'style: Auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: Update pre-commit hooks'
