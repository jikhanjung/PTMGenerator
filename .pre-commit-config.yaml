# Pre-commit hooks for PTMGenerator2
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ruff - linter + formatter, replacing black, isort, flake8 and pyupgrade.
  # Configuration lives in pyproject.toml under [tool.ruff].
  #
  # Keep `rev` in lockstep with the ruff pin in pyproject.toml's dev extra and
  # the `lint` job in .github/workflows/test.yml. A newer ruff reformats code
  # the pinned one accepted, which turns every unrelated PR red.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|rst|ts)$'
      - id: end-of-file-fixer
        # .qm files are compiled binaries and .ts is generated XML; both are
        # rewritten wholesale by the translation tools.
        exclude: '\.(qm|ts)$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # mypy - core/ and ui/, both with check_untyped_defs on. PyQt5 ships its own
  # stubs, so no stub package is needed.
  #
  # `language: system` and the project's own command, rather than the
  # mirrors-mypy hook. The mirror pins its own mypy in its own environment,
  # which drifted two years behind the version the lockfile installs -- so the
  # hook and CI could answer differently in either direction, and the answer a
  # contributor got locally was the one from neither.
  #
  # `pass_filenames: false` for the same reason: mypy follows imports
  # differently depending on which files it is handed, so only the identical
  # invocation guarantees the identical result. This is `make type-check` and
  # the `lint` job's command, character for character.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (core, ui)
        entry: mypy --config-file pyproject.toml core/ ui/
        language: system
        types: [python]
        files: '^(core|ui)/.*\.py$'
        pass_filenames: false

default_language_version:
  python: python3.12

ci:
  autofix_commit_msg: 'style: Auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: Update pre-commit hooks'
