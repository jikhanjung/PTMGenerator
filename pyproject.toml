# pyproject.toml - PTMGenerator2 project configuration

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PTMGenerator2"
# Not hardcoded here. version.py is the single source of truth; see
# [tool.setuptools.dynamic] below and tests/test_version_consistency.py.
dynamic = ["version"]
description = "Automated Polynomial Texture Mapping capture for an Arduino LED dome"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "PaleoBytes"}]
keywords = ["ptm", "polynomial-texture-mapping", "photography", "arduino", "rti"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "pyqt5>=5.15.0,<6.0.0",
    "pyserial>=3.5,<4.0.0",
    # The PTM fitter: the whole image is one matrix multiplication against a
    # precomputed pseudo-inverse, which numpy hands to BLAS. See
    # devlog/20260728_P02_NativePtmFitter.md.
    "numpy>=2.0.0,<3.0.0",
    # Decoding the captured JPEGs for that fit.
    "pillow>=10.0.0,<13.0.0",
    # version.py parses __version__ with it, so it is a runtime dependency and
    # not a tooling one.
    "semver>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    # ruff replaces black + isort + flake8 + pyupgrade. Pinned exactly, not
    # ranged: a newer ruff formats code the previous one accepted, so an
    # unpinned bump reformats the tree from under an unrelated PR. Bump
    # deliberately, together with .pre-commit-config.yaml and the `lint` job in
    # .github/workflows/test.yml.
    "ruff==0.16.0",
    "mypy>=1.7.0,<2.0.0",
    "pre-commit>=3.3.3",
    # lrelease, to compile translations/*.ts into the .qm files the app loads.
    # PyQt5 ships pylupdate5 but not lrelease; PySide6 provides it as
    # `pyside6-lrelease`. Not needed at runtime.
    "PySide6-Essentials>=6.6.0",
]
build = [
    "pyinstaller>=6.0.0",
]
docs = [
    "sphinx>=7.1.2",
    "sphinx-rtd-theme>=1.3.0",
    # Lets the manual include the repository-root CHANGELOG.md, which is the
    # single source of release history.
    "myst-parser>=2.0.0",
    "sphinx-intl>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/jikhanjung/PTMGenerator"
Repository = "https://github.com/jikhanjung/PTMGenerator"
Changelog = "https://github.com/jikhanjung/PTMGenerator/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools]
py-modules = ["PTMGenerator2", "version"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The application is imported from the repository root (core/, ui/, version),
# and it is not installed into the environment for a test run. `python -m
# pytest` would put the root on sys.path implicitly; a bare `pytest` does not,
# which is how CI ran it. Declare it so both invocations work.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage is NOT enabled by default so local runs stay fast; CI passes
# --cov=... --cov-fail-under=... explicitly.
addopts = """
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
"""

markers = [
    "unit: Fast, isolated, no Qt and no filesystem beyond tmp_path",
    "ui: Requires a QApplication and real widgets",
    "smoke: Import/startup checks - must pass on every OS in the matrix",
    "slow: May take more than a second",
    "property: Property-based tests using Hypothesis",
]

# Warnings are errors so silent runtime degradation (pending deprecations,
# unclosed resources) fails the build instead of scrolling past. Add a
# narrowly-scoped ignore with a comment - never a blanket ignore.
filterwarnings = [
    "error",
    # PyQt5's sip module emits this on Python 3.12 for its own enum shims.
    "ignore:.*sipPyTypeDict.*:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["core", "ui"]
omit = [
    "scripts/*",
    "tests/*",
    "legacy/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "build", "dist"]

[tool.ruff.lint]
# Grown incrementally, the way the reference projects did it: add a group, fix
# the tree, then commit. Anything not listed here is not yet clean.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "PTH",    # prefer pathlib
    "RUF",
    # Added 2026-07-28 after the audit in devlog R01. The groups the shared
    # code-quality guide names as catching real desktop bugs; all but DTZ were
    # already at zero violations, so this is a ratchet, not a cleanup.
    "DTZ",    # naive datetimes -- the DST bug in interval detection was one
    "S",      # bandit: eval/exec, shell=True, unsafe parsing
    "TRY",    # exception anti-patterns
    "LOG",    # logging anti-patterns
    "G",      # logging format
    "RET",    # dead returns
    "PIE",    # misc lint
    "PERF",   # obvious performance mistakes
    "A",      # shadowed builtins
    "C90",    # mccabe complexity -- see mccabe below
]
ignore = [
    # The Qt API is camelCase and the widget attributes mirror it (btnOkay,
    # edtPtmFitter). Renaming them would churn every call site for no gain.
    "N802", "N803", "N806",
    # `os.path` is used throughout and the paths are strings on the wire (CSV,
    # .lp files); a pathlib conversion is a separate, testable change. Tracked
    # in TODOs.md.
    "PTH118", "PTH120", "PTH123", "PTH110", "PTH100", "PTH103", "PTH119", "PTH208",
    "PTH107", "PTH122", "PTH202",
    # The one subprocess call launches the user's configured PTMfitter with a
    # fixed argument list and no shell. S603 fires on every subprocess call
    # regardless; S607 wants an absolute path, but the whole point of the
    # PTM Fitter preference is that the user chooses where it lives.
    "S603", "S607",
    # TRY003 wants message text moved into the exception class. For
    # core/self_test.py the message *is* the finding — "translations missing
    # from the bundle: ko" — and a per-raise subclass for each would be noise.
    "TRY003",
]

[tool.ruff.lint.mccabe]
# The guide's threshold. Nothing in the tree reaches it since the core/ui
# split; before it, take_picture_process and setup_ui were both well over.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# S101 is `assert`, which is what a test is made of -- 162 of the 165 S findings
# were this. SLF001: tests reach into private attributes to stage a fake serial
# port. PTH117: assertions about os.path results, not code under test.
# TRY: raising inline is how a test stages the failure it is about; abstracting
# it into a helper would hide the thing under test.
"tests/*" = ["S101", "SLF001", "PTH117", "TRY003", "TRY301"]
# Sphinx requires the module-level name `copyright`; it is not our choice.
"docs/manual/conf.py" = ["A001"]
# DTZ011: the release date stamped into CHANGELOG.md is a local calendar date
# on the maintainer's machine, which is what a changelog entry means. A UTC
# date would be wrong for anyone releasing in the evening east of Greenwich.
"scripts/bump_version.py" = ["DTZ011"]
# conftest sets QT_QPA_PLATFORM before importing PyQt5, which has to happen
# after the os import and before anything Qt-related.
"tests/conftest.py" = ["E402"]
# The polar LED table is a measured 5x10 grid. Wrapping it one pair per line
# would make it 50 lines and hide the shape.
"core/light_positions.py" = ["E501"]
# RUF001: the menu path is written "Edit › Preferences" with U+203A. It is the
# source string the .ts files are keyed on, so replacing it with ">" would
# orphan the Korean translation.
"ui/main_window.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# check_untyped_defs is the setting that matters here. The code carries few
# annotations, and by default mypy skips the *bodies* of unannotated functions
# entirely — so before this was turned on, "Success: no issues found" meant
# almost nothing had been examined. PyQt5 ships its own .pyi stubs and py.typed,
# so no third-party stub package is needed.
[[tool.mypy.overrides]]
module = "core.*"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true

# ui/ is in scope and clean at the default leniency. check_untyped_defs is NOT
# on for it yet: it surfaces 111 findings, essentially all from two systemic
# patterns rather than 111 separate mistakes —
#   * QApplication.instance() and menuBar().addMenu() are typed Optional, so
#     every use is a union-attr warning;
#   * the entry point bolts .translator/.language/.settings onto the
#     QApplication object, which no stub knows about.
# The second is a real design smell and wants a small typed holder rather than
# a blanket ignore. Tracked in TODOs.md.
[[tool.mypy.overrides]]
module = "ui.*"
check_untyped_defs = false
disallow_untyped_defs = false
